<body><div class="wrap">
__DASHBOARD_NAV__
<main id="main-content" tabindex="-1">
<header><h1 id="title">US Trend Bounce</h1><p class="purpose" id="purpose">US candidates in the Trend Bounce screen, ranked by repeat appearances.</p><div class="sub" id="status">Loading latest snapshot…</div><div class="formula" id="formula"></div></header>
__DASHBOARD_FRESHNESS__
<section class="kpis" id="summary"></section>
<section class="tablecard">
  <div class="rangebar">
    <span class="lab" id="rangeLabel">Periods</span><select id="fromPeriod" aria-label="Range start period"></select><span class="arrow">→</span><select id="toPeriod" aria-label="Range end period"></select>
    <button id="back" title="Shift one period older">◀</button><button id="forward" title="Shift one period newer">▶</button>
    <button data-window="1">1</button><button data-window="3">3</button><button data-window="5">5</button><button data-window="8">8</button><button data-window="13">13</button><button data-window="all">All</button>
    <span class="spacer"></span><span class="note" id="rangeNote"></span>
  </div>
  <div class="toolbar">
    <span class="count" id="rankHint">Loading rows…</span><span class="spacer"></span>
    <div class="filters"><button class="filter" id="filteredOnly">In filter</button><button id="crossOnly">In linked tab</button><button class="ht" id="htOnly">In HT</button><button class="congress" id="congressOnly" title="Only tickers with stored congressional transaction history" hidden>● Congress history</button><button id="pbOnly" hidden>PB</button><button id="mqOnly" hidden>MQ</button></div>
    <input id="search" type="search" placeholder="Search symbol or company…" autocomplete="off" aria-label="Search symbols and companies"><button id="download">⭳ CSV</button>
  </div>
  <div class="tablewrap"><table><thead><tr><th class="l" data-sort="symbol">Symbol</th><th class="l sorted" data-sort="count">Appearances (oldest→newest)</th><th class="l" data-sort="exchange">Exchange</th><th data-sort="latest_close">Last close</th><th data-sort="market_cap">Market cap</th><th data-sort="median_turnover_20">Median turnover</th><th data-sort="latest">Last signal</th></tr></thead><tbody id="rows"><tr><td colspan="7"><div class="empty">Loading snapshot…</div></td></tr></tbody></table></div>
</section><footer id="foot"></footer>
</main></div><div id="tt" role="tooltip" aria-hidden="true"></div>
<script src="market-events.js?v=2"></script>
<script>
const TIMEFRAME='__TIMEFRAME__';
const OTHER=TIMEFRAME==='weekly'?'daily':'weekly';
let DATA=null,HT=new Map(),EVENTS_READY=false;
const state={from:0,to:0,query:'',filtered:false,cross:false,ht:false,congress:false,pb:false,mq:false,sort:'count',desc:true};
const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const number=(value,digits=0)=>value==null||!Number.isFinite(Number(value))?'—':Number(value).toLocaleString(undefined,{maximumFractionDigits:digits});
const money=value=>value==null||!Number.isFinite(Number(value))?'—':Number(value)>=1e9?`$${number(Number(value)/1e9,1)}b`:Number(value)>=1e6?`$${number(Number(value)/1e6,1)}m`:`$${number(value,0)}`;
const periodSets=page=>new Map(page.weeks.map(period=>[period.week,new Set(period.tickers.map(ticker=>ticker.symbol))]));
const weekStart=date=>{const value=new Date(`${date}T00:00:00Z`),offset=(value.getUTCDay()+6)%7;value.setUTCDate(value.getUTCDate()-offset);return value.toISOString().slice(0,10)};
const periodLabel=date=>new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',day:'2-digit',month:'short',year:'numeric'}).format(new Date(`${date}T00:00:00Z`));
function validateSnapshot(snapshot){if(!snapshot||snapshot.schema_version!=='us-trend-bounce.snapshot.v1'||snapshot.market!=='US'||!snapshot.pages?.[TIMEFRAME]||!snapshot.pages?.[OTHER])throw new Error('Unsupported US Trend Bounce snapshot');return snapshot}
function extractHt(snapshot){
  const bucket=snapshot?.markets?.US?.timeframes?.[TIMEFRAME],map=new Map();if(!bucket)return map;
  const history=bucket.history;
  if(history?.schema_version==='ht-history.v1'&&Array.isArray(history.periods)&&Array.isArray(history.instruments)){
    const symbolIndex=history.instrument_columns.indexOf('symbol');
    for(const period of history.periods){const key=TIMEFRAME==='weekly'?weekStart(period.date):period.date,symbols=map.get(key)||new Set();for(const row of period.rows||[]){const instrument=history.instruments[row[0]];const symbol=instrument?.[symbolIndex];if(typeof symbol==='string')symbols.add(symbol)}map.set(key,symbols)}
  }else if(Array.isArray(bucket.rows)&&Array.isArray(snapshot.columns)){
    const symbolIndex=snapshot.columns.indexOf('symbol'),key=TIMEFRAME==='weekly'?weekStart(bucket.signal_date):bucket.signal_date;map.set(key,new Set(bucket.rows.map(row=>row[symbolIndex]).filter(symbol=>typeof symbol==='string')));
  }return map;
}
function linkedSet(date){const linked=DATA.otherSets;if(TIMEFRAME==='weekly'){const end=new Date(`${date}T00:00:00Z`);end.setUTCDate(end.getUTCDate()+6);const endDate=end.toISOString().slice(0,10),union=new Set();for(const period of DATA.other.weeks)if(period.week>=date&&period.week<=endDate)for(const symbol of linked.get(period.week)||[])union.add(symbol);return union}let chosen=null;for(const period of DATA.other.weeks){if(period.week<=date)chosen=period.week;else break}return chosen?linked.get(chosen)||new Set():new Set()}
function membership(value,date){return new Set(value?.weeks?.[date]||[])}
function selectedPeriods(){return DATA.page.weeks.slice(state.from,state.to+1)}
function buildRows(){
  const selected=selectedPeriods(),profiles=DATA.page.instruments||{},bySymbol=new Map();
  selected.forEach((period,index)=>{const filtered=membership(DATA.page.filter,period.week),cross=linkedSet(period.week),ht=HT.get(period.week)||new Set(),pb=membership(DATA.page.signals?.pb,period.week),mq=membership(DATA.page.signals?.mq,period.week);for(const ticker of period.tickers){let row=bySymbol.get(ticker.symbol);if(!row){row={symbol:ticker.symbol,present:new Array(selected.length).fill(false),inFilter:false,inCross:false,inHt:false,pb:false,mq:false,latest:period.week};bySymbol.set(ticker.symbol,row)}row.present[index]=true;row.latest=period.week;row.inFilter||=filtered.has(ticker.symbol);row.inCross||=cross.has(ticker.symbol);row.inHt||=ht.has(ticker.symbol);row.pb||=pb.has(ticker.symbol);row.mq||=mq.has(ticker.symbol)}});
  return [...bySymbol.values()].map(row=>({...profiles[row.symbol],...row,count:row.present.filter(Boolean).length,hasCongressHistory:!!MarketEvents.record(row.symbol)}));
}
function filteredRows(){const query=state.query.toLowerCase();return buildRows().filter(row=>(!query||`${row.symbol} ${row.name||''} ${row.exchange||''}`.toLowerCase().includes(query))&&(!state.filtered||row.inFilter)&&(!state.cross||row.inCross)&&(!state.ht||row.inHt)&&(!state.congress||row.hasCongressHistory)&&(!state.pb||row.pb)&&(!state.mq||row.mq)).sort((a,b)=>{let left=a[state.sort],right=b[state.sort];if(typeof left==='string'||typeof right==='string'){left=String(left??'');right=String(right??'');return state.desc?right.localeCompare(left):left.localeCompare(right)}left=Number(left??-Infinity);right=Number(right??-Infinity);return state.desc?right-left:left-right})}
function dotTip(period,on){return `${on?'●':'○'} ${periodLabel(period.week)}`}
function dots(row,periods){const hot=row.count===periods.length&&periods.length>1,tip=periods.map((period,index)=>dotTip(period,row.present[index])).join(' · ');return `<span class="frac">${row.count}<small>/${periods.length}</small></span><span class="dots" data-tip="${esc(tip)}">${row.present.map((on,index)=>`<span class="dot ${on?(hot?'hot':'on'):''}" title="${esc(dotTip(periods[index],on))}"></span>`).join('')}</span>`}
function badges(row){return `${row.inFilter?'<span class="pill filt">FILTER</span>':''}${row.inCross?`<span class="pill cross">${OTHER.toUpperCase()}</span>`:''}${row.inHt?'<span class="pill ht">HT</span>':''}${row.pb?'<span class="pill">PB</span>':''}${row.mq?'<span class="pill">MQ</span>':''}`}
function chartUrl(row){const aliases={'NYSE American':'AMEX','NYSE Arca':'AMEX','Cboe':'AMEX','NASDAQ Global Select':'NASDAQ','NASDAQ Capital Market':'NASDAQ'};const exchange=aliases[row.exchange]||row.exchange||'NASDAQ';return `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(`${exchange}:${row.symbol}`)}`}
function render(){
  const periods=selectedPeriods(),rows=filteredRows(),shown=rows.slice(0,500),latest=periods.at(-1),latestSet=new Set(latest.tickers.map(ticker=>ticker.symbol)),earlier=new Set(periods.slice(0,-1).flatMap(period=>period.tickers.map(ticker=>ticker.symbol))),newCount=[...latestSet].filter(symbol=>!earlier.has(symbol)).length,htCount=buildRows().filter(row=>row.inHt).length;
  $('#summary').innerHTML=[[`Union · ${periods.length} ${TIMEFRAME==='daily'?'days':'weeks'}`,buildRows().length],[`Latest · ${latest.week}`,latestSet.size],['New in latest',newCount],['Also in HT',htCount]].map(([label,value])=>`<div class="tile"><span class="lbl">${esc(label)}</span><span class="val">${number(value)}</span></div>`).join('');
  const congressCount=buildRows().filter(row=>row.hasCongressHistory).length;
  $('#congressOnly').textContent=`● Congress history (${congressCount.toLocaleString()})`;
  $('#rankHint').textContent=`${rows.length.toLocaleString()} matching potentials${state.congress?' · Congress history':''}`;
  $('#rows').innerHTML=shown.length?shown.map(row=>`<tr><td class="l"><a class="symbol" href="${chartUrl(row)}" target="_blank" rel="noopener">${esc(row.symbol)}</a>${badges(row)}${MarketEvents.dot(row.symbol)}<div class="name">${esc(row.name||row.symbol)}</div></td><td class="l">${dots(row,periods)}</td><td class="l">${esc(row.exchange||'—')}<div class="exchange">${esc(row.asset_type||'stock')}</div></td><td class="num">${row.latest_close==null?'—':`$${number(row.latest_close,2)}`}</td><td class="num">${money(row.market_cap)}</td><td class="num">${money(row.median_turnover_20)}</td><td>${esc(row.latest)}</td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">No symbols match these filters.</div></td></tr>';
  $('#foot').textContent=`Showing ${shown.length} of ${rows.length} matching rows · ${DATA.page.weeks.length} stored ${TIMEFRAME} periods`;
  $('#fromPeriod').value=state.from;$('#toPeriod').value=state.to;$('#back').disabled=state.from===0;$('#forward').disabled=state.to===DATA.page.weeks.length-1;$('#rangeNote').textContent=`${periods[0].week} → ${periods.at(-1).week}`;
  document.querySelectorAll('[data-window]').forEach(button=>{const wanted=button.dataset.window==='all'?DATA.page.weeks.length:Number(button.dataset.window);button.classList.toggle('on',periods.length===wanted&&state.to===DATA.page.weeks.length-1)});
}
function setRange(size){const total=DATA.page.weeks.length,wanted=size==='all'?total:Math.min(Number(size),total);state.to=total-1;state.from=total-wanted;render()}
function shift(delta){const size=state.to-state.from+1;let from=state.from+delta,to=state.to+delta;if(from<0){from=0;to=size-1}if(to>=DATA.page.weeks.length){to=DATA.page.weeks.length-1;from=to-size+1}state.from=from;state.to=to;render()}
function configure(){const periods=DATA.page.weeks,options=periods.map((period,index)=>`<option value="${index}">${period.week}</option>`).join('');$('#fromPeriod').innerHTML=options;$('#toPeriod').innerHTML=options;state.to=periods.length-1;state.from=Math.max(0,state.to-7);const daily=TIMEFRAME==='daily',suffix=daily?'D':'W';$('#rangeLabel').textContent=daily?'Days':'Weeks';$('#title').textContent=`US ${TIMEFRAME[0].toUpperCase()+TIMEFRAME.slice(1)} · Trend Bounce`;$('#purpose').textContent=`US ${daily?'daily candidates':'stocks in the weekly screen'}, ranked by repeat appearances inside the selected ${daily?'session':'week'} window.`;document.title=$('#title').textContent;document.querySelectorAll('[data-window]').forEach(button=>{if(button.dataset.window!=='all')button.textContent=`${button.dataset.window}${suffix}`});$('#crossOnly').textContent=`In US ${OTHER[0].toUpperCase()+OTHER.slice(1)}`;$('#congressOnly').hidden=!EVENTS_READY;$('#pbOnly').hidden=TIMEFRAME!=='daily';$('#mqOnly').hidden=TIMEFRAME!=='daily';$('#formula').textContent='Formula: EMA10 > EMA34 · EMA20 > EMA34 · EMA10 or Ichimoku-cloud bounce';render()}
async function load(){try{const [trendResponse,htResponse]=await Promise.all([fetch('/api/us-trend-bounce',{headers:{accept:'application/json'}}),fetch('/api/tsha-hbcs',{headers:{accept:'application/json'}})]),trendPayload=await trendResponse.json().catch(()=>({})),htPayload=await htResponse.json().catch(()=>({}));if(!trendResponse.ok||trendPayload.schema_version!=='us-trend-bounce.api.v1'||!trendPayload.snapshot)throw new Error(trendPayload.error||`HTTP ${trendResponse.status}`);const snapshot=validateSnapshot(trendPayload.snapshot);DATA={snapshot,page:snapshot.pages[TIMEFRAME],other:snapshot.pages[OTHER]};DATA.otherSets=periodSets(DATA.other);HT=htResponse.ok&&htPayload.schema_version==='tsha-hbcs.api.v1'?extractHt(htPayload.snapshot):new Map();$('#status').textContent=`US data through ${DATA.page.data_cutoff} · ${DATA.page.weeks.length} periods · HT overlap loaded for ${HT.size} periods`;configure()}catch(error){$('#status').classList.add('error');$('#status').textContent=`Snapshot unavailable: ${error.message}`;$('#rows').innerHTML='<tr><td colspan="7"><div class="empty">No stored US Trend Bounce data is available.</div></td></tr>'}}
$('#fromPeriod').addEventListener('change',event=>{state.from=Number(event.target.value);if(state.from>state.to)state.to=state.from;render()});$('#toPeriod').addEventListener('change',event=>{state.to=Number(event.target.value);if(state.to<state.from)state.from=state.to;render()});$('#back').addEventListener('click',()=>shift(-1));$('#forward').addEventListener('click',()=>shift(1));document.querySelectorAll('[data-window]').forEach(button=>button.addEventListener('click',()=>setRange(button.dataset.window)));
for(const [id,key] of [['filteredOnly','filtered'],['crossOnly','cross'],['htOnly','ht'],['congressOnly','congress'],['pbOnly','pb'],['mqOnly','mq']])$('#'+id).addEventListener('click',event=>{state[key]=!state[key];event.currentTarget.classList.toggle('on',state[key]);render()});$('#search').addEventListener('input',event=>{state.query=event.target.value;render()});document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{if(state.sort===th.dataset.sort)state.desc=!state.desc;else{state.sort=th.dataset.sort;state.desc=true}document.querySelectorAll('th[data-sort]').forEach(item=>item.classList.toggle('sorted',item===th));th.classList.toggle('asc',!state.desc);render()}));
$('#download').addEventListener('click',()=>{if(!DATA)return;const rows=filteredRows(),periods=selectedPeriods(),keys=['symbol','name','exchange','count','latest','inFilter','inCross','inHt','hasCongressHistory','latest_close','market_cap','median_turnover_20'],quote=value=>`"${String(value??'').replaceAll('"','""')}"`,csv=[keys.join(','),...rows.map(row=>keys.map(key=>quote(row[key])).join(','))].join('\n'),anchor=document.createElement('a');anchor.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));anchor.download=`us_trend_bounce_${TIMEFRAME}_${periods.at(-1).week}.csv`;anchor.click();URL.revokeObjectURL(anchor.href)});
const tooltip=$('#tt');function hideTip(){tooltip.style.opacity='0';tooltip.setAttribute('aria-hidden','true')}function showTip(text,x,y){tooltip.textContent=text.split(' · ').join('\n');tooltip.style.opacity='1';tooltip.setAttribute('aria-hidden','false');const box=tooltip.getBoundingClientRect();let left=x+12,top=y-box.height-8;if(left+box.width>innerWidth-8)left=x-box.width-12;if(top<8)top=y+16;tooltip.style.left=left+'px';tooltip.style.top=top+'px'}document.body.addEventListener('mousemove',event=>{const target=event.target.closest('.dots[data-tip]');if(!target){hideTip();return}showTip(target.dataset.tip,event.clientX,event.clientY)});document.body.addEventListener('mouseleave',hideTip);
load();MarketEvents.load('US',()=>{EVENTS_READY=true;if(DATA){$('#congressOnly').hidden=false;render()}});
</script>
