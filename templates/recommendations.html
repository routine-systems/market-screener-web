<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recommendation forward test</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#121212;--muted:#686861;--line:#deded7;--blue:#1c5cab;--green:#0a7d0a;--amber:#9a5b00}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0d;--card:#1a1a19;--ink:#f7f7f4;--muted:#9b9a92;--line:#33332f;--blue:#67a7f2;--green:#54c654;--amber:#f0b83e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px 20px 60px}nav{display:flex;gap:18px;border-bottom:1px solid var(--line);padding:0 0 10px;margin-bottom:22px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none;font-weight:600}nav a.on{color:var(--ink);border-bottom:2px solid var(--blue)}h1{font-size:23px;margin:0}.sub{color:var(--muted);margin:3px 0 20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.card b{font-size:24px;display:block}.card span{color:var(--muted);font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,input{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px}button.on{background:var(--blue);color:white}input{min-width:220px}.table{overflow:auto;max-height:72vh;background:var(--card);border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px 9px;white-space:nowrap;border-bottom:1px solid var(--line);text-align:right}th{position:sticky;top:0;background:var(--card);color:var(--muted);font-size:10px;text-transform:uppercase}th:nth-child(-n+5),td:nth-child(-n+5){text-align:left}td a{color:var(--blue);font-weight:700;text-decoration:none}tr.presented{box-shadow:inset 3px 0 var(--green)}tr.miss{background:color-mix(in srgb,var(--amber) 12%,transparent);box-shadow:inset 3px 0 var(--amber)}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px 10px 40px}}
</style></head><body><div class="wrap">
<nav><a href="dashboard.html">Weekly</a><a href="daily.html">Daily</a><a href="market.html">Market</a><a href="sectors.html">Sectors</a><a href="tsha_hbcs.html">HT</a><a href="recommendations.html" class="on">Forward Test</a></nav>
<h1>Recommendation forward test</h1><div class="sub" id="subtitle"></div>
<section class="cards"><div class="card"><b id="presented">0</b><span>Presented decisions</span></div><div class="card"><b id="nearMisses">0</b><span>Budget near misses</span></div><div class="card"><b id="tracked">0</b><span>Entered forward tests</span></div><div class="card"><b id="misses">0</b><span>Opportunity misses</span></div></section>
<div class="controls"><button class="on" data-filter="weekly">Weekly</button><button data-filter="IN">India</button><button data-filter="US">US</button><button data-filter="miss">Opportunity misses</button><button data-filter="daily">Daily archive</button><button data-filter="all">All history</button><input id="search" placeholder="Search symbol or stage"></div>
<div class="table"><table><thead><tr><th>Signal</th><th>Market</th><th>Frame</th><th>Symbol</th><th>Decision</th><th>Score</th><th>Twin HA</th><th>Return</th><th>Excess</th><th>MFE</th><th>MAE</th></tr></thead><tbody id="rows"></tbody></table></div>
</div><script>
function b64utf8(value){try{return decodeURIComponent(escape(atob(value)));}catch(error){return atob(value)}}
const payload=JSON.parse(b64utf8("__RECOMMENDATIONS_B64__"));
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null||Number.isNaN(Number(v))?'—':`${(Number(v)*100).toFixed(1)}%`;
document.querySelector('#subtitle').textContent=`Immutable decisions and point-in-time outcomes · Last updated ${payload.last_updated_ist||'—'}${payload.data_as_of?` · Source data through ${payload.data_as_of}`:''}`;
for(const [id,key] of [['presented','presented'],['nearMisses','near_misses'],['tracked','tracked'],['misses','opportunity_misses']])document.querySelector('#'+id).textContent=payload.summary?.[key]??0;
const tbody=document.querySelector('#rows');
for(const row of payload.rows||[]){const tr=document.createElement('tr');tr.dataset.market=row.market||'';tr.dataset.timeframe=row.timeframe||'';tr.dataset.stage=row.decision_stage||'';if(row.opportunity_miss)tr.classList.add('miss');else if(row.presented)tr.classList.add('presented');const market=row.market||'';const symbol=esc(row.symbol);const tv=market==='IN'?`https://www.tradingview.com/chart/?symbol=NSE%3A${encodeURIComponent(row.symbol)}`:`https://www.tradingview.com/chart/?symbol=${encodeURIComponent(row.exchange||'NASDAQ')}%3A${encodeURIComponent(row.symbol)}`;tr.innerHTML=`<td>${esc(row.signal_date)}</td><td>${esc(market)}</td><td>${esc(row.timeframe)}</td><td><a href="${tv}" target="_blank" rel="noopener">${symbol}</a></td><td>${esc(row.presented?'Presented':String(row.decision_stage||'').replaceAll('_',' '))}</td><td>${esc(row.model_rank_score)}</td><td>${esc(row.twin_ha_status)}</td><td>${pct(row.return_since_entry)}</td><td>${pct(row.excess_return_since_entry)}</td><td>${pct(row.max_favorable_excursion)}</td><td>${pct(row.max_adverse_excursion)}</td>`;tbody.appendChild(tr)}
const buttons=[...document.querySelectorAll('button[data-filter]')],rows=[...tbody.children],search=document.querySelector('#search');let filter='weekly';function apply(){const q=search.value.trim().toLowerCase();for(const row of rows){const match=filter==='all'||row.dataset.market===filter||row.dataset.timeframe===filter||(filter==='miss'&&row.classList.contains('miss')&&row.dataset.timeframe==='weekly');row.hidden=!match||!row.textContent.toLowerCase().includes(q)}}buttons.forEach(button=>button.onclick=()=>{buttons.forEach(item=>item.classList.remove('on'));button.classList.add('on');filter=button.dataset.filter;apply()});search.oninput=apply;apply();
</script></body></html>
