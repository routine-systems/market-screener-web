name: probe-scrape

# One-off diagnostic: can a GitHub runner (datacenter IP) actually scrape Chartink,
# or does Cloudflare bot-management challenge it? Run manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chrome version
        run: google-chrome --version || echo "no google-chrome on runner"
      - name: Install deps
        run: pip install selenium webdriver-manager
      - name: Scrape one screener (weekly)
        run: |
          set +e
          python3 scrape.py --url https://chartink.com/screener/cp-ich-trend-bounce-wkly --timeout 60 2>&1 | tee scrape.log
          echo "exit_code=$?"
      - name: Verdict
        if: always()
        run: |
          echo "=== data/ ==="; ls -la data 2>/dev/null || echo "(no data dir)"
          f=$(ls data/*_backtest_latest.csv 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            rows=$(($(wc -l < "$f") - 1))
            echo "CSV: $f  rows=$rows"; head -3 "$f"
            if [ "$rows" -gt 10 ]; then echo "::notice::PROBE SUCCESS — GHA can scrape Chartink ($rows rows)"; else echo "::warning::PROBE too-few-rows ($rows)"; fi
          else
            echo "::error::PROBE FAILED — no CSV (Cloudflare block or timeout likely)"
            echo "--- scrape.log tail (look for 'Just a moment' = Cloudflare challenge) ---"
            tail -25 scrape.log 2>/dev/null || true
            exit 1
          fi
